name: scholar_path
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.2
  url_launcher: ^6.3.1
  device_preview: ^1.2.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  google_sign_in: ^6.2.1
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.70.2
  google_generative_ai: ^0.4.6
  shared_preferences: ^2.5.4
  flutter_facebook_auth: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ai_config.json
    - assets/images/
    - assets/images/brightly_custom_logo.png
    - assets/images/logo_combined.png
    - assets/images/google_logo.png
    - assets/images/onboarding_1.jpg
    - assets/images/onboarding_2.jpg
    - assets/images/onboarding_3.jpg
